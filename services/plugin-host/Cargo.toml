[package]
name = "braino-plugin-host"
version = "0.1.24"
edition = "2021"

[dependencies]
axum = "0.8"
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
wasmtime = { version = "50", default-features = false, features = ["async", "cranelift", "component-model", "runtime", "std", "wat"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
