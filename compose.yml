name: braino

x-braino-app: &braino-app
  image: ${BRAINO_IMAGE:-braino:local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BRAINO_VERSION: ${BRAINO_VERSION:-local}
  restart: unless-stopped
  environment:
    BRAINO_DATABASE_URL: postgresql://braino:${BRAINO_POSTGRES_PASSWORD:?set BRAINO_POSTGRES_PASSWORD in .env}@postgres:5432/braino
    BRAINO_ENCRYPTION_KEY: ${BRAINO_ENCRYPTION_KEY:?set BRAINO_ENCRYPTION_KEY in .env}
    BRAINO_SETUP_TOKEN: ${BRAINO_SETUP_TOKEN:?set BRAINO_SETUP_TOKEN in .env}
    BRAINO_PUBLIC_HOST: ${BRAINO_PUBLIC_HOST:-http://localhost:3000}
    QDRANT_URL: http://qdrant:6333
    BRAINO_CODELINKER_URL: http://codelinker:8080
    BRAINO_CODELINKER_API_TOKEN: ${BRAINO_CODELINKER_API_TOKEN:?set BRAINO_CODELINKER_API_TOKEN in .env}
    BRAINO_PLUGIN_HOST_URL: http://plugin-host:8080
    BRAINO_PLUGIN_HOST_API_TOKEN: ${BRAINO_PLUGIN_HOST_API_TOKEN:?set BRAINO_PLUGIN_HOST_API_TOKEN in .env}
    BRAINO_PLUGIN_MAX_EXECUTION_MS: ${BRAINO_PLUGIN_MAX_EXECUTION_MS:-60000}
    BRAINO_PLUGIN_GATEWAY_URL: ${BRAINO_PLUGIN_GATEWAY_URL:-https://plugins.braino.dev}
  networks: [private]

services:
  app:
    <<: *braino-app
    ports:
      - "127.0.0.1:${BRAINO_HTTP_PORT:-3000}:3000"
    depends_on:
      codelinker:
        condition: service_healthy
      ollama-chat-model:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully
      plugin-host:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4

  scheduler:
    <<: *braino-app
    command: ["node", "runtime/scheduler.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 4
    depends_on:
      app:
        condition: service_healthy

  codelinker:
    image: ${BRAINO_CODELINKER_IMAGE:-braino-codelinker:local}
    build:
      context: .
      dockerfile: services/codelinker/Dockerfile
    restart: unless-stopped
    environment:
      BRAINO_CODELINKER_API_TOKEN: ${BRAINO_CODELINKER_API_TOKEN:?set BRAINO_CODELINKER_API_TOKEN in .env}
      BRAINO_CODELINKER_MAX_FILES: ${BRAINO_CODELINKER_MAX_FILES:-10000}
      BRAINO_CODELINKER_MAX_FILE_BYTES: ${BRAINO_CODELINKER_MAX_FILE_BYTES:-200000}
      BRAINO_CODELINKER_MAX_TOTAL_BYTES: ${BRAINO_CODELINKER_MAX_TOTAL_BYTES:-67108864}
      PORT: 8080
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "braino-codelinker", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 4
    networks: [private]

  plugin-host:
    image: ${BRAINO_PLUGIN_HOST_IMAGE:-braino-plugin-host:local}
    build:
      context: .
      dockerfile: services/plugin-host/Dockerfile
    restart: unless-stopped
    environment:
      BRAINO_PLUGIN_HOST_API_TOKEN: ${BRAINO_PLUGIN_HOST_API_TOKEN:?set BRAINO_PLUGIN_HOST_API_TOKEN in .env}
      BRAINO_PLUGIN_MAX_COMPONENT_BYTES: ${BRAINO_PLUGIN_MAX_COMPONENT_BYTES:-16777216}
      BRAINO_PLUGIN_MAX_MEMORY_BYTES: ${BRAINO_PLUGIN_MAX_MEMORY_BYTES:-67108864}
      BRAINO_PLUGIN_MAX_RESPONSE_BYTES: ${BRAINO_PLUGIN_MAX_RESPONSE_BYTES:-8388608}
      BRAINO_PLUGIN_MAX_EXECUTION_MS: ${BRAINO_PLUGIN_MAX_EXECUTION_MS:-60000}
      BRAINO_PLUGIN_HTTP_TIMEOUT_MS: ${BRAINO_PLUGIN_HTTP_TIMEOUT_MS:-50000}
      BRAINO_PLUGIN_MAX_FUEL: ${BRAINO_PLUGIN_MAX_FUEL:-100000000}
      BRAINO_PLUGIN_MAX_CACHED_COMPONENTS: ${BRAINO_PLUGIN_MAX_CACHED_COMPONENTS:-16}
      BRAINO_PLUGIN_LOCAL_NETWORK_HOSTS: ${BRAINO_PLUGIN_LOCAL_NETWORK_HOSTS:-ollama:11434}
      PORT: 8080
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "braino-plugin-host", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 4
    networks: [private]

  ollama:
    image: ${BRAINO_OLLAMA_IMAGE:-ollama/ollama:0.40.16}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - braino-ollama:/root/.ollama
    expose: ["11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  ollama-model:
    image: ${BRAINO_OLLAMA_IMAGE:-ollama/ollama:0.40.16}
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${BRAINO_OLLAMA_EMBEDDING_MODEL:-embeddinggemma-2:270m}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [private]

  ollama-chat-model:
    image: ${BRAINO_OLLAMA_IMAGE:-ollama/ollama:0.40.16}
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${BRAINO_OLLAMA_CHAT_MODEL:-qwen3.5:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [private]

  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: braino
      POSTGRES_USER: braino
      POSTGRES_PASSWORD: ${BRAINO_POSTGRES_PASSWORD:?set BRAINO_POSTGRES_PASSWORD in .env}
    volumes:
      - braino-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braino -d braino"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes:
      - braino-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  caddy:
    image: caddy:2.10-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      BRAINO_HOST: ${BRAINO_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - braino-caddy-data:/data
      - braino-caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [private]

networks:
  private:

volumes:
  braino-postgres:
  braino-qdrant:
  braino-ollama:
  braino-caddy-data:
  braino-caddy-config:
